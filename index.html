<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Campus Navigator - Batanes State College</title>
    <link rel="icon" href="logo-240.webp" type="image/webp">
    <link rel="stylesheet" href="style.css">
    <!-- Download the map's files in the background while the welcome page is open,
         so "Enter Campus Map" opens faster. -->
    <link rel="prefetch" href="models/unang_palapag.model.gz" crossorigin="anonymous">
    <link rel="prefetch" href="models/2nd_floor.model.gz" crossorigin="anonymous">
    <link rel="prefetch" href="models/3rd_floor_final.model.gz" crossorigin="anonymous">
    <link rel="prefetch" href="vendor/three/three.module.min.js" crossorigin="anonymous">
    <link rel="prefetch" href="map.js" crossorigin="anonymous">
    <link rel="prefetch" href="map.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Faded overlay -->
    <div class="overlay"></div>

    <!-- Main UI -->
    <main class="welcome-container">

        <!-- Logo -->
        <div class="logo-container">
            <img src="logo-240.webp" alt="Batanes State College Logo" class="logo" width="120" height="120">
            <div class="brand-text">
                <h1>BSC</h1>
                <p class="college-name">Batanes State College</p>
            </div>
        </div>

        <!-- Enter Button -->
        <button id="enterButton">
            <span>Enter Campus Map</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
        </button>

        <!-- Subtitle -->
        <p class="subtitle">
            Builds minds, Serves communities, Create opportunities
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
