<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Campus Navigator - Batanes State College</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Faded overlay -->
    <div class="overlay"></div>

    <!-- Main UI -->
    <main class="welcome-container">

        <!-- Logo -->
        <div class="logo-container">
            <img src="logo.png" alt="Batanes State College Logo" class="logo">
            <div class="brand-text">
                <h1>BSC</h1>
                <p class="college-name">Batanes State College</p>
            </div>
        </div>

        <!-- Enter Button -->
        <button id="enterButton">
            <span>Enter Campus Map</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>

        <!-- Subtitle -->
        <p class="subtitle">
            A Project of the Academic Services Office
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
